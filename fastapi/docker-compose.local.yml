# Local development: the API on http://localhost:8000 (only this computer, not the network).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# The old development UI (main.py, pipeline_ui.html) on http://localhost:8001:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile dev-ui up -d

services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  dev-ui:
    image: lo-generator-fastapi:latest
    profiles: [dev-ui]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
