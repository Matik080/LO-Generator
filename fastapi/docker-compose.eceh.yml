# Deployment next to ECEH: api and scheduler also join ECEH's Docker network, so Laravel calls
# http://lo-generator:8000 and the scheduler can send webhooks to Laravel (task 7).
#
#   docker compose -f docker-compose.yml -f docker-compose.eceh.yml up -d
#
# LOGEN_ECEH_NETWORK = name of ECEH's network (`docker network ls`), default "eceh".

services:
  api:
    networks:
      logen: {}
      eceh:
        aliases: [lo-generator]   # a unique name in ECEH's network ("api" may already exist there)
  scheduler:
    networks: [logen, eceh]   # sends the webhooks

networks:
  eceh:
    external: true
    name: ${LOGEN_ECEH_NETWORK:-eceh}
